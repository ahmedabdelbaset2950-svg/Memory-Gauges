<form class="report-filter" method="get">
  <select name="year" onchange="this.form.submit()">
    {% if not years %}<option value="{{ year }}">{{ year }}</option>{% endif %}
    {% for y in years %}<option value="{{ y }}" {{ 'selected' if y == year else '' }}>{{ y }}</option>{% endfor %}
  </select>
  <select name="month" onchange="this.form.submit()">
    <option value="">All Months</option>
    {% for m in range(1,13) %}<option value="{{ m }}" {{ 'selected' if month == m else '' }}>{{ months[m-1] }}</option>{% endfor %}
  </select>
</form>

{% set export_kind = {
    'reports.dashboard': 'dashboard',
    'reports.actual_gauges': 'actual-gauges',
    'reports.performance': 'performance',
    'reports.batteries': 'batteries',
    'reports.engineers': 'engineers'
}.get(request.endpoint) %}

{% if export_kind %}
<a class="export-btn"
   href="{{ url_for('reports.export_report', kind=export_kind, year=year, month=month) }}">
    <i class="bi bi-file-earmark-excel"></i> Export Excel
</a>
{% endif %}
